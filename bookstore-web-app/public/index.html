<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bookstore</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/" aria-label="Bookstore home">Bookstore</a>
      <label class="search">
        <span class="sr-only">Search books</span>
        <input id="searchInput" type="search" placeholder="Search title, author, or category">
      </label>
    </header>

    <main>
      <section class="hero">
        <p class="baseline-banner">Version 1.0 - Baseline</p>
        <p class="eyebrow">Curated reads</p>
        <h1>Find your next favorite book.</h1>
        <p>Browse our hand-picked collection of stories, ideas, and adventures.</p>
      </section>

      <section class="add-book-section" aria-labelledby="addBookHeading">
        <div>
          <p class="eyebrow">Your shelf</p>
          <h2 id="addBookHeading">Add a book</h2>
        </div>
        <form id="addBookForm" class="add-book-form">
          <label>
            <span>Title</span>
            <input name="title" type="text" maxlength="120" required>
          </label>
          <label>
            <span>Author</span>
            <input name="author" type="text" maxlength="80" required>
          </label>
          <label>
            <span>Category</span>
            <input name="category" type="text" maxlength="80" required>
          </label>
          <label class="featured-toggle">
            <input name="isNewArrival" type="checkbox">
            <span>Featured / New Arrival</span>
          </label>
          <button type="submit">Add book</button>
        </form>
        <p id="formMessage" class="form-message" aria-live="polite"></p>
      </section>

      <section aria-labelledby="catalogHeading">
        <div class="section-heading">
          <h2 id="catalogHeading">Featured books</h2>
          <p id="resultCount" aria-live="polite"></p>
        </div>
        <div id="bookGrid" class="book-grid"></div>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
